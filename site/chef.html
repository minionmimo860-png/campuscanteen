<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#153a2d">
    <meta name="description" content="Administrator console for Campus Canteen.">
    <title>Admin Console | Campus Canteen</title>
    <link rel="stylesheet" href="./static/style.css">
</head>
<body data-page="admin">
    <header class="site-header">
        <a class="brand" href="./" aria-label="Campus Canteen home">
            <span class="brand-mark" aria-hidden="true">C</span>
            <span>Campus Canteen</span>
        </a>
        <div id="account-bar" class="account-bar"></div>
    </header>

    <main class="page-shell">
        <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
        <div id="app" class="app-panel" aria-live="polite">
            <section class="loading-state">
                <span class="loader" aria-hidden="true"></span>
                <p>Loading admin console…</p>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <p>Campus Canteen <span aria-hidden="true">·</span> <a href="./">Customer sign in</a></p>
    </footer>

    <script src="./static/config.js"></script>
    <script type="module" src="./static/app.js"></script>
</body>
</html>
