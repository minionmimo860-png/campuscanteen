
{% extends "base.html" %}

{% block content %}

<div class="welcome">
    <h1>🍽️ Our Food Menu</h1>
    <p>Welcome, {{ session.get('name') }}! Choose your favourite food.</p>
</div>

<div class="food-grid">

    {% for id, food in foods.items() %}

    <div class="food-card">

        <div class="food-emoji">{{ food.emoji }}</div>

        <h3>{{ food.name }}</h3>

        <h2>₹{{ food.price }}</h2>

        <form method="POST"
              action="{{ url_for('add_to_cart', food_id=id) }}">

            <button type="submit">Add to Cart +</button>

        </form>

    </div>

    {% endfor %}

</div>

<div class="cart-link">
    <a href="{{ url_for('cart') }}" class="button-link">
        🛒 View My Cart
    </a>
</div>

{% endblock %}
